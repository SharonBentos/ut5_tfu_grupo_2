services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: movies
      POSTGRES_PASSWORD: movies
      POSTGRES_DB: movies
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movies -d movies"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  reviews-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reviews
      POSTGRES_PASSWORD: reviews
      POSTGRES_DB: reviews
    volumes:
      - reviews-postgres-data:/var/lib/postgresql/data
      - ./postgres/reviews/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviews -d reviews"]
      interval: 5s
      timeout: 3s
      retries: 10


  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  stats-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
      POSTGRES_DB: stats
    volumes:
      - stats-postgres-data:/var/lib/postgresql/data
      - ./postgres/stats/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats -d stats"]
      interval: 5s
      timeout: 3s
      retries: 10

  stats-init:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    command: ["python", "-m", "stats_service.init_stats"]
    environment:
      DATABASE_URL: postgresql://stats:stats@stats-db:5432/stats
    depends_on:
      stats-db:
        condition: service_healthy
    networks:
      - backend

  stats:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://stats:stats@stats-db:5432/stats
      REDIS_URL: redis://redis:6379/0
    expose:
      - "8000"
    depends_on:
      stats-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  stats-consumer:
    build:
      context: ./services/stats
      dockerfile: Dockerfile
    scale: 3
    command: ["python", "-m", "stats_service.consumer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://stats:stats@stats-db:5432/stats
      REDIS_URL: redis://redis:6379/0
    depends_on:
      stats-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - backend

  stats-adapter:
    build:
      context: ./services/stats-adapter
      dockerfile: Dockerfile
    environment:
      STATS_SOAP_URL: http://stats:8000/soap/estadisticas
    expose:
      - "8000"
    depends_on:
      stats:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  reviews:
    build:
      context: ./services/reviews
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://reviews:reviews@reviews-db:5432/reviews
    expose:
      - "8000"
    depends_on:
      reviews-db:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  reviews-relay:
    build:
      context: ./services/reviews
      dockerfile: Dockerfile
    scale: 3
    restart: unless-stopped
    command: ["python", "-m", "reviews_service.outbox_relay"]
    environment:
      DATABASE_URL: postgresql://reviews:reviews@reviews-db:5432/reviews
      REDIS_URL: redis://redis:6379/0
    depends_on:
      reviews-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  users:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    scale: 3
    environment:
      DATABASE_URL: postgresql://movies:movies@postgres:5432/movies
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 3

  users-consumer:
    build:
      context: ./services/users
      dockerfile: Dockerfile
    scale: 3
    command: ["python", "-m", "users_service.consumer"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://movies:movies@postgres:5432/movies
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      stats:
        condition: service_started
      reviews:
        condition: service_started
      users:
        condition: service_started
    networks:
      - frontend
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/gateway/health | grep -q ok || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres-data:
    driver: local
  reviews-postgres-data:
    driver: local
  stats-postgres-data:
    driver: local
  redis-data:
    driver: local
